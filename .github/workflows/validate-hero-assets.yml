name: Validate GiftVerse hero assets

on:
  push:
    paths:
      - "index.html"
      - "tools/validate-game-script.mjs"
      - "tools/generate-researcher-svg.mjs"\n      - "tools/package-researcher-assets.mjs"
      - "assets/characters/researcher/**"
      - "tools/validate-hero-assets.mjs"
      - "tools/validate-researcher-source.mjs"
      - ".github/workflows/validate-hero-assets.yml"
  pull_request:
    paths:
      - "index.html"
      - "tools/validate-game-script.mjs"
      - "assets/characters/researcher/**"
      - "tools/validate-hero-assets.mjs"
      - "tools/validate-researcher-source.mjs"
      - ".github/workflows/validate-hero-assets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate playable game script syntax
        run: node tools/validate-game-script.mjs
      - name: Generate procedural researcher frames
        run: node tools/generate-researcher-svg.mjs
      - name: Package and validate procedural frames\n        run: node tools/package-researcher-assets.mjs\n      - name: Upload generated researcher source package\n        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808\n        with:\n          name: giftverse-researcher-procedural-source\n          path: assets/characters/researcher/procedural/\n          if-no-files-found: error\n          retention-days: 14\n      - name: Validate embedded researcher frames
        run: node tools/validate-researcher-source.mjs
      - name: Check ES module syntax
        run: node --input-type=module --check < assets/characters/researcher/researcher-assets.js
