name: Validate GiftVerse hero assets

on:
  push:
    paths:
      - "index.html"
      - "tools/validate-game-script.mjs"
      - "tools/generate-researcher-svg.mjs"
      - "tools/package-researcher-assets.mjs"\n      - "tools/validate-procedural-atlas.mjs"
      - "assets/characters/researcher/**"
      - "tools/validate-hero-assets.mjs"
      - "tools/validate-researcher-source.mjs"
      - ".github/workflows/validate-hero-assets.yml"
  pull_request:
    paths:
      - "index.html"
      - "tools/validate-game-script.mjs"
      - "tools/generate-researcher-svg.mjs"
      - "tools/package-researcher-assets.mjs"
      - "assets/characters/researcher/**"
      - "tools/validate-hero-assets.mjs"
      - "tools/validate-researcher-source.mjs"
      - ".github/workflows/validate-hero-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate playable game script syntax
        run: node tools/validate-game-script.mjs
      - name: Generate procedural researcher frames
        run: node tools/generate-researcher-svg.mjs
      - name: Package and validate procedural frames
        run: node tools/package-researcher-assets.mjs
      - name: Upload generated researcher source package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: giftverse-researcher-procedural-source
          path: assets/characters/researcher/procedural/
          if-no-files-found: error
          retention-days: 14
      - name: Commit generated procedural frames
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build procedural researcher SVG animation frames"
          file_pattern: "assets/characters/researcher/procedural/frames/** assets/characters/researcher/procedural/manifest.json assets/characters/researcher/procedural/researcher-atlas.json assets/characters/researcher/procedural/researcher-atlas.svg assets/characters/researcher/procedural/BUILD-INFO.txt"
      - name: Validate embedded researcher frames
        run: node tools/validate-researcher-source.mjs
      - name: Check ES module syntax
        run: node --input-type=module --check < assets/characters/researcher/researcher-assets.js
